<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
<body>
<title>Trilho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: navegação fina no topo; cursos com painel lateral + percurso em zigue-zague; lições centradas com barra de ação no fundo */
:root{
  --bg:#ffffff;--bg2:#f5f5f2;--card:#ffffff;--ink:#16171a;--muted:#62656e;--line:#e4e4df;--line2:#d4d4ce;
  --btn:#16171a;--btnInk:#ffffff;--btnEdge:#000000;
  --acc:#3d5afe;--acc2:#7c4dff;--sel:#2f6fed;--selbg:#eef3ff;
  --good:#1e8e3e;--goodbg:#e6f4ea;--goodEdge:#b7dfc2;--bad:#c5221f;--badbg:#fce8e6;--badEdge:#f4c3be;--warnc:#b45309;--warnbg:#fff4e0;
  --codebg:#14161c;--codeink:#e6e8ee;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--bg2:#1b1d21;--card:#1b1d21;--ink:#eef0f3;--muted:#a0a4ad;--line:#2c2f35;--line2:#3a3e45;--btn:#f2f3f5;--btnInk:#121316;--btnEdge:#9a9ea6;--sel:#7aa2ff;--selbg:#1d2740;--goodbg:#13291b;--goodEdge:#245c35;--badbg:#341716;--badEdge:#6b2a27;--warnbg:#33260f;--warnc:#f0b46a;--codebg:#0b0c0f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--bg2:#1b1d21;--card:#1b1d21;--ink:#eef0f3;--muted:#a0a4ad;--line:#2c2f35;--line2:#3a3e45;--btn:#f2f3f5;--btnInk:#121316;--btnEdge:#9a9ea6;--sel:#7aa2ff;--selbg:#1d2740;--goodbg:#13291b;--goodEdge:#245c35;--badbg:#341716;--badEdge:#6b2a27;--warnbg:#33260f;--warnc:#f0b46a;--codebg:#0b0c0f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--sel)}
h1,h2,h3{text-wrap:balance;letter-spacing:-.02em;line-height:1.15}
h1{font-size:clamp(1.7rem,4.2vw,2.4rem);font-weight:800;margin:.15em 0 .3em}
h2{font-size:1.35rem;font-weight:800;margin:.4em 0 .5em}
h3{font-size:1.05rem;font-weight:800;margin:.1em 0 .6em}
.muted{color:var(--muted)}.small{font-size:.875rem}.center{text-align:center}.tnum{font-variant-numeric:tabular-nums}
.kicker{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:1.1rem;color:var(--muted);max-width:60ch}
.ico{display:inline-flex;width:1.15em;height:1.15em;vertical-align:-.2em}.ico svg{width:100%;height:100%}.ico.sm{width:.95em;height:.95em}
:focus-visible{outline:3px solid var(--sel);outline-offset:2px;border-radius:8px}

/* Navegação */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;height:60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.2rem;color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.mark{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,#0f9d76,#0ea5e9,#e8590c,#f59f00,#0f9d76);box-shadow:inset 0 0 0 4px var(--bg)}
.nlinks{display:flex;gap:4px;flex:1}
.nl{color:var(--muted);text-decoration:none;font-weight:600;padding:7px 12px;border-radius:10px}
.nl:hover{background:var(--bg2);color:var(--ink)}.nl.on{color:var(--ink);background:var(--bg2)}
.nright{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:800;padding:6px 10px;border-radius:10px;font-variant-numeric:tabular-nums}
.chip.flame{color:#e8590c}.chip.bolt{color:#d4a106}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--ink);cursor:pointer}
.iconbtn:hover{background:var(--bg2)}.iconbtn .ico{width:22px;height:22px}
.iconbtn.dot::after{content:"";position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:#e8590c;box-shadow:0 0 0 2px var(--bg)}
.iconbtn.warn{background:var(--badbg);color:var(--bad)}

/* Páginas */
.page{max-width:1180px;margin:0 auto;padding-block:28px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page.narrow{max-width:760px}
.backlink{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font:inherit;font-weight:600;background:none;border:0;padding:0;cursor:pointer;margin-bottom:10px}
.backlink:hover{color:var(--ink)}

/* Botões (estilo "tecla" com aresta inferior) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;font-size:1rem;padding:12px 22px;border-radius:12px;border:2px solid var(--line2);border-bottom-width:4px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;transition:transform .06s,filter .15s}
.btn:hover{filter:brightness(.97)}.btn:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.btn.primary{background:var(--btn);color:var(--btnInk);border-color:var(--btn);border-bottom-color:var(--btnEdge)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:.88rem;border-bottom-width:3px}
.btn.wide{width:100%}
.btn.danger{color:var(--bad)}
.good-b{background:var(--good)!important;border-color:var(--good)!important;border-bottom-color:color-mix(in srgb,var(--good) 60%,#000)!important;color:#fff!important}
.bad-b{background:var(--card)!important;color:var(--bad)!important;border-color:var(--badEdge)!important}
.row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Hub */
.hello{padding-block:10px 6px}
.hello h1{font-size:clamp(2rem,5vw,3rem)}
.courses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:22px}
.ccard{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;overflow:hidden;transition:transform .12s,border-color .12s}
.ccard:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 55%,var(--line))}
.ccard-art{display:grid;place-items:center;padding:22px;background:color-mix(in srgb,var(--acc) 14%,var(--bg2))}
.ccard-art .art{width:150px;height:150px}
.ccard-body{display:flex;flex-direction:column;gap:8px;padding:20px 22px 22px}
.ccard-body h2{margin:0;font-size:1.6rem}
.ccard-body p{margin:0}
.ccard .btn{align-self:flex-start;margin-top:6px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.goalpill{font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg2);color:var(--muted)}
.goalpill.ok{background:var(--goodbg);color:var(--good)}
.pbar{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.pbar span{display:block;height:100%;min-width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.how b{display:flex;align-items:center;gap:7px}.how p{margin:.35em 0 0;color:var(--muted);font-size:.94rem}
.strip{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);margin-top:14px}
.strip>.ico{width:24px;height:24px;flex:none;color:var(--muted)}.strip>div{flex:1;min-width:0}
.strip.late{background:var(--warnbg);border-color:color-mix(in srgb,var(--warnc) 35%,transparent)}.strip.late>.ico{color:var(--warnc)}
.strip.ok{background:var(--goodbg);border-color:var(--goodEdge)}.strip.ok>.ico{color:var(--good)}

/* Arte SVG */
.art .pins rect{fill:color-mix(in srgb,var(--acc) 55%,var(--ink))}
.art .die{fill:var(--ink)}.art .core{fill:color-mix(in srgb,var(--acc) 30%,var(--ink))}
.art .a0{fill:color-mix(in srgb,var(--acc) 55%,var(--ink))}.art .a1{fill:var(--acc)}.art .a2{fill:var(--acc2)}
.art .road{fill:color-mix(in srgb,var(--ink) 80%,var(--bg))}.art .lane{stroke:var(--acc2);stroke-width:4;stroke-linecap:round;fill:none}
.art .sign-o{fill:#d32f2f}.art .sign-i{fill:#fff}.art .sign-t{font:800 17px Arial,sans-serif;fill:#111}.art .pole{fill:var(--muted)}
.art .edge{stroke:color-mix(in srgb,var(--acc) 45%,var(--line2));stroke-width:2}.art .n0{fill:var(--acc)}.art .n1{fill:var(--acc2)}.art .n2{fill:var(--card);stroke:var(--acc);stroke-width:3}
.art .hill{stroke:var(--acc);stroke-width:5;fill:none;stroke-linecap:round}.art .sun{fill:var(--acc2)}

/* Curso */
.course{display:grid;grid-template-columns:340px minmax(0,1fr);gap:40px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
.cside{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:22px;padding:20px}
.cside-art{display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,var(--bg2));border-radius:16px;padding:14px;margin-bottom:14px}
.cside-art .art{width:110px;height:110px}
.cside h1{font-size:1.7rem;margin:.1em 0 .5em}
.cside .btn.wide{margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiles>div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.tiles b{font-size:1.25rem;font-variant-numeric:tabular-nums}.tiles span{font-size:.75rem;color:var(--muted)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr));margin:18px 0}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
.panel.soft{background:var(--bg2);border-color:transparent}
.side .panel{margin:0}
details.panel summary{cursor:pointer}
.stack{margin:0;display:grid;gap:2px}.stack dt{font-weight:700;font-size:.85rem;margin-top:8px}.stack dd{margin:0;color:var(--muted);font-size:.88rem}
.srcs{padding-left:1.1em;font-size:.88rem}.srcs li{margin:.2em 0}

/* Percurso em zigue-zague */
.path{display:flex;flex-direction:column;align-items:center;padding-bottom:60px;min-width:0}
.phase{width:100%;max-width:520px;text-align:center;margin:30px 0 16px;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--acc) 12%,var(--bg2));border:2px solid color-mix(in srgb,var(--acc) 25%,transparent)}
.phase h3{margin:.2em 0}
.unit{margin:26px 0 12px;font-weight:800;font-size:.95rem;color:var(--muted);text-align:center;max-width:420px}
.prow{position:relative;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--x));margin:8px 0}
.pnode{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font:inherit;font-size:1.1rem;cursor:pointer;border:3px solid var(--line2);border-bottom-width:7px;background:var(--card);color:var(--muted);transition:transform .08s}
.pnode .ico{width:28px;height:28px}
.pnode:hover{transform:translateY(-2px)}
.pnode.open{border-color:var(--acc);color:var(--acc)}
.pnode.done{background:var(--acc);border-color:color-mix(in srgb,var(--acc) 70%,#000);color:#fff}
.pnode.cur{width:80px;height:80px;background:var(--acc);border-color:color-mix(in srgb,var(--acc) 70%,#000);color:#fff;box-shadow:0 0 0 8px color-mix(in srgb,var(--acc) 22%,transparent);animation:pulse 2.2s ease-in-out infinite}
.pnode.lock{background:var(--bg2);color:var(--line2);cursor:not-allowed}
.pnode.exam{border-radius:22px}
.plabel{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:220px;font-size:.84rem;font-weight:600;line-height:1.25;margin-top:6px;color:var(--ink)}
.plabel small{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prow:has(.lock) .plabel{color:var(--muted)}
.pop{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 16px;margin-bottom:12px;max-width:260px}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--acc) 10%,transparent)}}
@media (prefers-reduced-motion:reduce){.pnode.cur{animation:none}*{transition:none!important}}

/* Dia */
.steps{display:flex;flex-direction:column;gap:12px;margin:22px 0}
.step{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:16px;font:inherit;color:var(--ink);cursor:pointer}
.step:hover{border-color:color-mix(in srgb,var(--acc) 50%,var(--line))}
.sic{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:14px;background:color-mix(in srgb,var(--acc) 14%,var(--bg2));color:var(--acc)}
.sic .ico{width:24px;height:24px}
.step.done .sic{background:var(--acc);color:#fff}
.stx{flex:1;display:flex;flex-direction:column;min-width:0}.stx small{color:var(--muted)}
.score{font-weight:800;color:var(--good);font-variant-numeric:tabular-nums}

/* Lembrete */
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;margin-bottom:14px}
.field input[type=time]{font:inherit;font-size:1.5rem;font-weight:700;padding:8px 12px;border-radius:12px;border:2px solid var(--line2);background:var(--bg);color:var(--ink);max-width:180px}
.seg{display:flex;gap:14px;flex-wrap:wrap;font-weight:500}
select{font:inherit;padding:5px 8px;border-radius:9px;border:2px solid var(--line2);background:var(--bg);color:var(--ink)}
.opt-list{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.rem-opt{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);text-decoration:none;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;cursor:pointer}
.rem-opt:hover{border-color:var(--line2)}.rem-opt:disabled{opacity:.6;cursor:default}
.rem-opt>span:last-child{display:flex;flex-direction:column;min-width:0}.rem-opt small{color:var(--muted)}
.ro-ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--bg2)}

/* Lição (runner) */
.runner{min-height:100vh;padding-bottom:180px}
.rtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg)}
.segs{flex:1;display:flex;gap:4px;min-width:0}
.segs span{flex:1;height:8px;border-radius:99px;background:var(--bg2);border:1px solid var(--line)}
.segs .f{background:var(--acc);border-color:var(--acc)}.segs .c{background:color-mix(in srgb,var(--acc) 40%,var(--bg2));border-color:transparent}
.rbody{max-width:680px;margin:0 auto;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.qcard{font-size:1.06rem;margin-top:8px}
.qcard h2{font-size:1.6rem;margin-top:.2em}
.qlabel{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.prose p{margin:.55em 0}.prose ul,.prose ol{padding-left:1.3em}.prose li{margin:.3em 0}
.prose .q,.q{font-size:1.12rem;font-weight:600}
.prose table{border-collapse:collapse;width:100%;margin:.7em 0;font-size:.9rem;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}.prose th{background:var(--bg2)}
.prose code{font-family:var(--f-mono);background:var(--bg2);padding:1px 5px;border-radius:5px;font-size:.88em}
.code{font-family:var(--f-mono);background:var(--codebg);color:var(--codeink);padding:14px 16px;border-radius:12px;overflow-x:auto;font-size:.84rem;line-height:1.55;white-space:pre;max-width:100%}
.key{border:2px solid color-mix(in srgb,var(--acc) 35%,transparent);background:color-mix(in srgb,var(--acc) 9%,var(--card));padding:10px 14px;border-radius:12px;margin:.8em 0}
.warn{border:2px solid color-mix(in srgb,var(--warnc) 35%,transparent);background:var(--warnbg);padding:10px 14px;border-radius:12px;margin:.8em 0}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line2);border-bottom-width:5px;border-radius:14px;padding:13px 15px;cursor:pointer}
.opt:hover{background:var(--bg2)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;border:2px solid var(--line2);font-weight:800;font-size:.8rem;color:var(--muted)}
.opt.sel{border-color:var(--sel);background:var(--selbg)}.opt.sel .k{border-color:var(--sel);color:var(--sel)}
.opt.right{border-color:var(--good);background:var(--goodbg)}.opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.numin{display:flex;gap:10px;align-items:center;margin-top:16px}
.numin input,textarea{flex:1;width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line2);background:var(--bg);color:var(--ink)}
.numin input:focus,textarea:focus{outline:none;border-color:var(--sel)}
textarea{font-size:.95rem;margin-top:8px}
.model{margin-top:14px;padding:14px;border-radius:12px;background:var(--bg2)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fbmsg{flex:1;min-width:0;max-height:38vh;overflow:auto}
.fbmsg:empty{display:none}
.dock-btns{display:flex;gap:10px;margin-left:auto}.dock-btns .btn{min-width:150px}
.dock.good{background:var(--goodbg);border-top-color:var(--goodEdge)}.dock.bad{background:var(--badbg);border-top-color:var(--badEdge)}
.fbt{font-size:1.2rem;display:block;margin-bottom:2px}.dock.good .fbt{color:var(--good)}.dock.bad .fbt{color:var(--bad)}
.dock .prose{font-size:.95rem}
.done-card{padding:40px 0}
.burst{width:96px;height:96px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,var(--bg2));color:var(--acc)}
.burst .ico{width:48px;height:48px}

/* Widgets e sinais */
.sign{display:inline-block;vertical-align:middle;margin:6px 8px 6px 0}
.wg{display:flex;flex-direction:column;gap:12px;margin-top:10px}.wg label{display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.w100{width:100%;accent-color:var(--acc)}.wg-out{background:var(--bg2);border-radius:12px;padding:12px}
.wg-row{display:flex;gap:10px}.tog{flex-direction:row!important;align-items:center;gap:8px!important;background:var(--bg2);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}
.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gate{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:space-between;font-family:var(--f-mono)}
.gate.on{border-color:var(--good);background:var(--goodbg)}
.big.mono{display:flex;gap:4px;flex-wrap:wrap}.bit{width:36px;height:44px;display:grid;place-items:center;border-radius:8px;background:var(--bg2);font-family:var(--f-mono);font-size:1.3rem;font-weight:700}.bit.on{background:var(--acc);color:#fff}
.gdplot svg{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}.gdc{fill:none;stroke:var(--muted);stroke-width:2}.gdl{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 3}.gdp{fill:var(--acc)}
.good{color:var(--good)}.bad{color:var(--bad)}
.bar{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--bg2)}.bar .r{background:#f59e0b}.bar .b{background:#dc2626}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 8px}.dot.r{background:#f59e0b}.dot.b{background:#dc2626}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.chk input{margin-top:5px;accent-color:var(--acc);width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:99;max-width:min(90vw,520px);font-weight:600;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:900px){
  .course{grid-template-columns:minmax(0,1fr);gap:18px}.side{position:static}
  .how{grid-template-columns:repeat(2,minmax(0,1fr))}
  .courses{grid-template-columns:minmax(0,1fr)}
  .ccard{flex-direction:row}.ccard-art{flex:0 0 36%}
}
@media (max-width:640px){
  .ccard{flex-direction:column}
  .nlinks{display:none}.nav-in{gap:8px}.brand{flex:1}
  .ccard-art .art{width:110px;height:110px}
  .how{grid-template-columns:minmax(0,1fr)}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}

  .dock-in{flex-direction:column;align-items:stretch;gap:10px}.dock-btns{margin-left:0}.dock-btns .btn{flex:1;min-width:0}
  .prow{transform:translateX(calc(var(--x) * .6))}
  .chip.bolt{display:none}
}

<script>
const TRILHO_URL = "https://luciosilva-dev.github.io/trilho/";
'use strict';
/* ====== Motor de aprendizagem estilo "lições interativas" (partilhado pelas duas apps) ====== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/* Construtores de cartões usados nos ficheiros de dados */
const T = (h, b) => ({ t: 'text', h, b });
const Q = (q, o, a, e) => ({ t: 'mcq', q, o, a, e });
const TF = (q, a, e) => ({ t: 'mcq', q, o: ['Verdadeiro', 'Falso'], a: a ? 0 : 1, e, fixed: 1 });
const N = (q, ans, tol, u, e) => ({ t: 'num', q, ans, tol: tol || 0, u: u || '', e });
const F = (q, acc, e) => ({ t: 'fill', q, acc: [].concat(acc), e });
const OPEN = (q, ans) => ({ t: 'open', q, ans });
const W = (name, o) => ({ t: 'widget', name, o: o || {} });
const G = id => ({ t: 'gen', id });
const CODE = c => `<pre class="code">${esc(c.replace(/^\n/, '').replace(/\s+$/, ''))}</pre>`;
const SRC = (n, u) => ({ n, u });

/* Sinais de trânsito em SVG (estilizados) */
function SIGN(k, txt = '', size = 90) {
  const s = size, h = s / 2;
  const T2 = (t, fs, col = '#111', y = h + fs * 0.35) => `<text x="${h}" y="${y}" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="${fs}" fill="${col}">${esc(t)}</text>`;
  let b = '';
  switch (k) {
    case 'limit': b = `<circle cx="${h}" cy="${h}" r="${h - 6}" fill="#fff" stroke="#d32f2f" stroke-width="${s * .11}"/>` + T2(txt, s * (String(txt).length > 2 ? .3 : .38)); break;
    case 'min': b = `<circle cx="${h}" cy="${h}" r="${h - 3}" fill="#1565c0"/>` + T2(txt, s * .36, '#fff'); break;
    case 'end': b = `<circle cx="${h}" cy="${h}" r="${h - 4}" fill="#fff" stroke="#555" stroke-width="2"/>` + T2(txt, s * .34, '#777') + `<line x1="${s * .2}" y1="${s * .8}" x2="${s * .8}" y2="${s * .2}" stroke="#333" stroke-width="3"/>`; break;
    case 'stop': { const r = h - 3, p = []; for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; p.push((h + r * Math.cos(a)).toFixed(1) + ',' + (h + r * Math.sin(a)).toFixed(1)); } b = `<polygon points="${p.join(' ')}" fill="#d32f2f" stroke="#fff" stroke-width="3"/>` + T2('STOP', s * .26, '#fff'); break; }
    case 'yield': b = `<polygon points="4,6 ${s - 4},6 ${h},${s - 6}" fill="#fff" stroke="#d32f2f" stroke-width="${s * .09}" stroke-linejoin="round"/>`; break;
    case 'danger': b = `<polygon points="${h},5 ${s - 4},${s - 8} 4,${s - 8}" fill="#fff" stroke="#d32f2f" stroke-width="${s * .09}" stroke-linejoin="round"/>` + T2(txt, s * .3, '#111', s * .76); break;
    case 'prohib': b = `<circle cx="${h}" cy="${h}" r="${h - 6}" fill="#fff" stroke="#d32f2f" stroke-width="${s * .11}"/>` + T2(txt, s * .32) + `<line x1="${s * .24}" y1="${s * .24}" x2="${s * .76}" y2="${s * .76}" stroke="#d32f2f" stroke-width="${s * .08}"/>`; break;
    case 'noentry': b = `<circle cx="${h}" cy="${h}" r="${h - 3}" fill="#d32f2f"/><rect x="${s * .18}" y="${h - s * .08}" width="${s * .64}" height="${s * .16}" fill="#fff"/>`; break;
    case 'nostop': b = `<circle cx="${h}" cy="${h}" r="${h - 6}" fill="#1565c0" stroke="#d32f2f" stroke-width="${s * .11}"/><line x1="${s * .24}" y1="${s * .24}" x2="${s * .76}" y2="${s * .76}" stroke="#d32f2f" stroke-width="${s * .08}"/><line x1="${s * .76}" y1="${s * .24}" x2="${s * .24}" y2="${s * .76}" stroke="#d32f2f" stroke-width="${s * .08}"/>`; break;
    case 'nopark': b = `<circle cx="${h}" cy="${h}" r="${h - 6}" fill="#1565c0" stroke="#d32f2f" stroke-width="${s * .11}"/><line x1="${s * .24}" y1="${s * .24}" x2="${s * .76}" y2="${s * .76}" stroke="#d32f2f" stroke-width="${s * .08}"/>`; break;
    case 'mand': b = `<circle cx="${h}" cy="${h}" r="${h - 3}" fill="#1565c0"/>` + T2(txt, s * .4, '#fff'); break;
    case 'info': b = `<rect x="3" y="3" width="${s - 6}" height="${s - 6}" rx="6" fill="#1565c0"/>` + T2(txt, s * .4, '#fff'); break;
    case 'prio': b = `<polygon points="${h},4 ${s - 4},${h} ${h},${s - 4} 4,${h}" fill="#fff" stroke="#333" stroke-width="2"/><polygon points="${h},${s * .2} ${s * .8},${h} ${h},${s * .8} ${s * .2},${h}" fill="#f9c80e"/>`; break;
  }
  return `<svg class="sign" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" role="img" aria-label="sinal">${b}</svg>`;
}

/* RNG determinístico (mulberry32) */
function rng(seed) {
  let a = seed >>> 0;
  const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
  f.pick = arr => arr[Math.floor(f() * arr.length)];
  f.shuffle = arr => { arr = arr.slice(); for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  return f;
}
/* opções numéricas plausíveis para geradores */
function numOpts(r, ans, fmt = x => x, spread = .35) {
  const set = new Set([fmt(ans)]); let guard = 0;
  while (set.size < 4 && guard++ < 50) { const k = 1 + (r() * 2 - 1) * spread * (1 + guard / 10); set.add(fmt(ans * k)); }
  while (set.size < 4) set.add(fmt(ans) + ' ' + '′'.repeat(set.size));
  const o = [...set]; return { o, a: 0 };
}
const round = (x, d = 2) => Math.round(x * 10 ** d) / 10 ** d;

/* ======================= Widgets interativos ======================= */
const Widgets = {
  logic(el) {
    el.innerHTML = `<div class="wg"><div class="wg-row"><label class="tog"><input type="checkbox" data-k="a"> A</label><label class="tog"><input type="checkbox" data-k="b"> B</label></div><div class="gates"></div></div>`;
    const upd = () => {
      const a = +el.querySelector('[data-k=a]').checked, b = +el.querySelector('[data-k=b]').checked;
      const rows = [['AND', a & b], ['OR', a | b], ['XOR', a ^ b], ['NAND', 1 - (a & b)], ['NOR', 1 - (a | b)], ['XNOR', 1 - (a ^ b)]];
      el.querySelector('.gates').innerHTML = rows.map(([n, v]) => `<div class="gate ${v ? 'on' : ''}"><b>${n}</b><span>${v}</span></div>`).join('');
    };
    el.querySelectorAll('input').forEach(i => i.oninput = upd); upd();
  },
  binconv(el) {
    el.innerHTML = `<div class="wg"><label>Valor (padrão de 8 bits): <input type="range" min="0" max="255" value="173" class="w100"></label><div class="big mono"></div><div class="wg-out"></div></div>`;
    const rg = el.querySelector('input'), out = el.querySelector('.wg-out'), big = el.querySelector('.big');
    const upd = () => {
      const v = +rg.value, bits = v.toString(2).padStart(8, '0'), s = v > 127 ? v - 256 : v;
      big.innerHTML = bits.split('').map((c, i) => `<span class="bit ${c === '1' ? 'on' : ''}" title="2^${7 - i}">${c}</span>`).join('');
      out.innerHTML = `Sem sinal: <b>${v}</b> · Hex: <b>0x${v.toString(16).toUpperCase().padStart(2, '0')}</b> · Complemento para 2 (com sinal): <b>${s}</b>`;
    };
    rg.oninput = upd; upd();
  },
  slack(el) {
    const P = [['Tclk', 'Período de relógio (ps)', 200, 2000, 1000], ['tcq', 't_clk→Q (ps)', 20, 150, 60], ['tlog', 'Atraso lógico máx. (ps)', 50, 1800, 700], ['tsu', 't_setup (ps)', 10, 120, 40], ['skew', 'Skew captura−lançamento (ps)', -200, 200, 0]];
    el.innerHTML = `<div class="wg">${P.map(([k, l, a, b, v]) => `<label>${l}: <b data-v="${k}">${v}</b><input type="range" min="${a}" max="${b}" value="${v}" data-k="${k}" class="w100"></label>`).join('')}<div class="wg-out"></div></div>`;
    const upd = () => {
      const g = k => +el.querySelector(`[data-k=${k}]`).value; P.forEach(([k]) => el.querySelector(`[data-v=${k}]`).textContent = g(k));
      const req = g('tcq') + g('tlog') + g('tsu'), slack = g('Tclk') + g('skew') - req, fmax = 1e6 / Math.max(1, req - g('skew'));
      el.querySelector('.wg-out').innerHTML = `Folga de setup = Tclk + skew − (tcq + tlog + tsu) = <b class="${slack >= 0 ? 'good' : 'bad'}">${slack} ps</b> ${slack >= 0 ? '✔ cumpre' : '✘ VIOLA'} · f<sub>máx</sub> ≈ <b>${fmax.toFixed(0)} MHz</b>`;
    };
    el.querySelectorAll('input').forEach(i => i.oninput = upd); upd();
  },
  power(el) {
    const P = [['a', 'Fator de atividade α', 1, 100, 15, 100], ['c', 'Capacidade comutada C (nF)', 1, 200, 50, 10], ['v', 'Tensão V (mV)', 500, 1200, 800, 1000], ['f', 'Frequência f (MHz)', 100, 3000, 1500, 1]];
    el.innerHTML = `<div class="wg">${P.map(([k, l, a, b, v]) => `<label>${l}: <b data-v="${k}"></b><input type="range" min="${a}" max="${b}" value="${v}" data-k="${k}" class="w100"></label>`).join('')}<div class="wg-out"></div></div>`;
    const upd = () => {
      const a = el.querySelector('[data-k=a]').value / 100, c = el.querySelector('[data-k=c]').value / 10 * 1e-9, v = el.querySelector('[data-k=v]').value / 1000, f = el.querySelector('[data-k=f]').value * 1e6;
      el.querySelector('[data-v=a]').textContent = a.toFixed(2); el.querySelector('[data-v=c]').textContent = (c * 1e9).toFixed(1); el.querySelector('[data-v=v]').textContent = v.toFixed(2) + ' V'; el.querySelector('[data-v=f]').textContent = (f / 1e6) + ' MHz';
      const p = a * c * v * v * f; el.querySelector('.wg-out').innerHTML = `P<sub>din</sub> = α·C·V²·f = <b>${p.toFixed(2)} W</b> — repara: baixar V 10% poupa ~19%.`;
    };
    el.querySelectorAll('input').forEach(i => i.oninput = upd); upd();
  },
  stopdist(el) {
    el.innerHTML = `<div class="wg"><label>Velocidade: <b data-v="v"></b><input type="range" min="20" max="150" value="90" step="5" data-k="v" class="w100"></label>
    <label>Tempo de reação: <b data-v="t"></b><input type="range" min="5" max="25" value="10" data-k="t" class="w100"></label>
    <label>Piso: <select data-k="m"><option value="0.8">Seco (μ≈0,8)</option><option value="0.5">Molhado (μ≈0,5)</option><option value="0.2">Neve (μ≈0,2)</option><option value="0.1">Gelo (μ≈0,1)</option></select></label><div class="bars"></div><div class="wg-out"></div></div>`;
    const upd = () => {
      const v = +el.querySelector('[data-k=v]').value, t = el.querySelector('[data-k=t]').value / 10, m = +el.querySelector('[data-k=m]').value;
      el.querySelector('[data-v=v]').textContent = v + ' km/h'; el.querySelector('[data-v=t]').textContent = t.toFixed(1) + ' s';

      el.querySelector('.bars').innerHTML = `<div class="bar"><span class="r" style="width:${dr * sc}%"></span><span class="b" style="width:${db * sc}%"></span></div><small><span class="dot r"></span> reação <span class="dot b"></span> travagem</small>`;
      el.querySelector('.wg-out').innerHTML = `Reação: <b>${dr.toFixed(1)} m</b> + Travagem: <b>${db.toFixed(1)} m</b> = Paragem: <b>${tot.toFixed(1)} m</b>`;
    };

  },
  gd(el) {
    el.innerHTML = '<div class="wg"><label>Learning rate η: <b data-v="e"></b><input type="range" min="1" max="110" value="20" data-k="e" class="w100"></label><div class="gdplot"></div><div class="wg-out"></div></div>';
    const upd = () => {
      const eta = el.querySelector('[data-k=e]').value / 100; el.querySelector('[data-v=e]').textContent = eta.toFixed(2);
      let x = 4; const xs = [x]; for (let i = 0; i < 10; i++) { x = x - eta * 2 * x; xs.push(x); }
      const W = 300, Hh = 150, sx = v => W / 2 + Math.max(-1, Math.min(1, v / 5)) * (W / 2 - 10), sy = v => Hh - 10 - Math.min(1, (v * v) / 25) * (Hh - 25);
      let path = ''; for (let v = -5; v <= 5.01; v += 0.25) path += (path ? 'L' : 'M') + sx(v).toFixed(1) + ' ' + sy(v).toFixed(1);
      const pts = xs.map((v, i) => `<circle cx="${sx(v).toFixed(1)}" cy="${sy(v).toFixed(1)}" r="${i ? 4 : 6}" class="gdp" style="opacity:${1 - i * 0.07}"/>`).join('');
      const steps = xs.slice(0, -1).map((v, i) => `<line x1="${sx(v).toFixed(1)}" y1="${sy(v).toFixed(1)}" x2="${sx(xs[i + 1]).toFixed(1)}" y2="${sy(xs[i + 1]).toFixed(1)}" class="gdl"/>`).join('');
      el.querySelector('.gdplot').innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Passos da descida do gradiente em f(x)=x²"><path d="${path}" class="gdc"/>${steps}${pts}</svg>`;
      const msg = eta > 1 ? 'diverge: cada passo afasta-se do mínimo' : eta > 0.5 ? 'oscila de um lado para o outro' : eta < 0.06 ? 'converge, mas muito devagar' : 'converge bem';
      el.querySelector('.wg-out').innerHTML = `Depois de 10 passos: x = <b>${xs[10].toFixed(3)}</b> (${msg}). Cada passo multiplica x por (1 − 2η) = ${(1 - 2 * eta).toFixed(2)}.`;
    };
    el.querySelector('input').oninput = upd; upd();
  },
  gap(el) {
    el.innerHTML = `<div class="wg"><label>Velocidade: <b data-v="v"></b><input type="range" min="30" max="120" step="10" value="90" data-k="v" class="w100"></label><div class="wg-out"></div></div>`;
    const upd = () => { const v = +el.querySelector('[data-k=v]').value, ms = v / 3.6; el.querySelector('[data-v=v]').textContent = v + ' km/h'; el.querySelector('.wg-out').innerHTML = `A ${v} km/h percorres <b>${ms.toFixed(1)} m/s</b>. Regra dos 2 s → <b>${(2 * ms).toFixed(0)} m</b>. Com chuva (≥3 s) → <b>${(3 * ms).toFixed(0)} m</b>. Em gelo/neve multiplica muito mais.`; };
    el.querySelector('input').oninput = upd; upd();
  },
};

  T('Detetor de sequência 1011 (com sobreposição)', `<p>Estados = "quanto da sequência já vi": S0 (nada), S1 ("1"), S2 ("10"), S3 ("101"). Mealy: em S3 com entrada 1 → saída 1 e vai para S1 (o último "1" pode começar nova sequência).</p>` + CODE(`

  unique case (st)

    S1: nx = x ? S1 : S2;
    S2: nx = x ? S3 : S0;
    S3: begin nx = x ? S1 : S2; det = x; end
  endcase
end`)),

module acc #(parameter int W = 16) (
  input  logic         clk, rst_n, en,

GEN('g_little', 'noc', (r, l) => { const bw = r.pick([100, 256, 500, 1000, 2000, 3000]), lat = r.pick([200, 400, 500, 600, 800]), kb = round(bw * lat / 1024, 1); return N(`Para sustentar <b>${bw} GB/s</b> com latência de memória de <b>${lat} ns</b>, quantos KB de pedidos têm de estar em voo? (1 KB = 1024 B)`, kb, kb * 0.02, 'KB', `Lei de Little: bytes em voo = ${bw} GB/s × ${lat} ns = ${bw * lat} B ≈ ${kb} KB.`); });
GEN('g_bw', 'noc', (r, l) => { const w = r.pick([1024, 2048, 4096, 5120]), g = r.pick([2, 3.2, 3.6, 6.4, 8]), bw = round(w * g / 8, 1); return N(`Memória com barramento de <b>${w} bits</b> a <b>${g} Gb/s por pino</b>. Largura de banda (GB/s)?`, bw, 0.5, 'GB/s', `${w} × ${g} / 8 = ${bw} GB/s.`); });
GEN('g_ring', 'inv', (r, l) => { const n = r.pick([3, 5, 7, 11, 21, 31]), t = r.pick([10, 15, 20, 25, 30]), f = round(1e6 / (2 * n * t), 1); return N(`Ring oscillator com <b>${n}</b> inversores de ${t} ps cada. Frequência (MHz)?`, f, f * 0.01, 'MHz', `f = 1/(2·N·t<sub>pd</sub>) = 1/(2×${n}×${t} ps) ≈ ${f} MHz.`); });
GEN('g_elmore', 'rc', (r, l) => { const n = r.int(2, l > 2 ? 10 : 5), R = r.pick([50, 100, 200]), C = r.pick([2, 5, 10]), t = R * C * n * (n + 1) / 2 / 1000; return N(`Escada RC com <b>${n}</b> secções iguais (R=${R} Ω, C=${C} fF cada). Atraso de Elmore até ao último nó (ps)?`, round(t, 3), 0.01, 'ps', `τ = R·C·N(N+1)/2 = ${R}×${C}fF×${n * (n + 1) / 2} = ${round(t, 3)} ps (Ω·fF = 10⁻³ ps).`); });
GEN('g_le', 'le', (r, l) => { const H = r.pick([16, 27, 64, 100, 256]), N2 = r.int(2, 5), f = H ** (1 / N2), D = N2 * f + N2; return N(`Cadeia de <b>${N2}</b> inversores conduz uma carga ${H}× a capacidade de entrada (G=1, B=1, p=1 por inversor). Atraso mínimo D (em τ, 1 casa decimal)?`, round(D, 1), 0.15, 'τ', `f̂ = ${H}^(1/${N2}) = ${round(f, 2)}; D = N·f̂ + N·p = ${round(N2 * f, 2)} + ${N2} = ${round(D, 1)} τ. (Ótimo: N ≈ log₄${H} = ${round(Math.log(H) / Math.log(4), 1)}.)`); });
GEN('g_power', 'power', (r, l) => { const a = r.pick([0.05, 0.1, 0.15, 0.2]), C = r.pick([10, 20, 50, 100]), V = r.pick([0.7, 0.75, 0.8, 0.9, 1.0]), f = r.pick([1, 1.5, 2, 2.5]), P = round(a * C * 1e-9 * V * V * f * 1e9, 2); return N(`α=${a}, C=${C} nF, V<sub>DD</sub>=${V} V, f=${f} GHz. Potência dinâmica (W)?`, P, 0.02, 'W', `α·C·V²·f = ${a}×${C}e-9×${V}²×${f}e9 = ${P} W.`); });

/* ============ Banco de perguntas de entrevista (abertas + escolha múltipla) ============ */
const IV = (tag, q, ans) => { const o = OPEN(q, ans); o.tag = tag; COURSE.interview.push(o); };
IV('timing', 'Explica setup e hold time a alguém que nunca ouviu falar. Porque é que o hold não depende da frequência?', 'Setup: o dado tem de estar estável um tempo antes do flanco; hold: tem de se manter estável um tempo depois. O setup envolve o caminho do flanco de lançamento ao flanco <b>seguinte</b> de captura (logo depende de T). O hold compara o dado lançado num flanco com o mesmo flanco no flop de captura (corrida entre dado novo e captura do antigo) — T não entra.');
IV('timing', 'Tens uma violação de setup de 50 ps num caminho entre dois módulos. Lista 5 formas de a corrigir, do RTL ao físico.', '1) Pipelining/retiming; 2) reestruturar lógica (menos níveis, mover lógica para o ciclo anterior, one-hot, pré-cálculo); 3) reduzir fan-out (duplicar registos); 4) upsizing / células LVT no caminho; 5) melhor placement (aproximar flops), useful skew; 6) relaxar requisito se legítimo (multicycle).');
IV('timing', 'Um caminho tem violação de setup E de hold ao mesmo tempo (em corners diferentes). Como é possível e o que fazes?', 'Setup no corner lento e hold no rápido, ou grande incerteza/OCV. Corrigir hold com buffers atrasa o caminho — tem de caber no setup. Soluções: reduzir lógica (ganhar margem de setup) e depois pôr atraso; rever skew (talvez skew grande no relógio — corrigir CTS); usar células de atraso com menos variação.');
IV('meta', 'O que é metastabilidade? Pode ser eliminada?', 'Estado intermédio de um elemento biestável quando a entrada viola a janela setup/hold; resolução em tempo não limitado com probabilidade a decair exponencialmente. Não pode ser eliminada, só tornada improvável (MTBF de séculos) com sincronizadores, mais tempo de resolução, flops com τ baixo.');
IV('cdc', 'Como passas um barramento de 32 bits de um domínio de relógio para outro?', 'Não com sincronizadores por bit. Opções: (a) handshake req/ack com dado estável (MCP formulation) — baixa largura de banda; (b) FIFO assíncrono — débito contínuo; (c) se o valor muda por incrementos (contador), Gray code; (d) se é quase estático (configuração), sincronizar um enable/valid e garantir estabilidade. Verificar com ferramenta CDC.');
IV('cdc', 'Desenha um pulse synchronizer de um domínio rápido para lento. Que limitação tem?', 'Origem: toggle flop (t <= t ^ pulse). Destino: 2-FF sync do toggle + flop extra + XOR = pulso de 1 ciclo. Limitação: pulsos de origem têm de estar espaçados ≥ ~2–3 ciclos do destino; senão perdem-se (dois toggles cancelam-se). Para pulsos frequentes → handshake/contador/FIFO.');
IV('fifodepth', 'Escritor a 100 MHz: 80 dados em cada janela de 100 ciclos (posição aleatória na janela). Leitor a 100 MHz: lê 8 em cada 10 ciclos. Profundidade mínima?', 'Primeiro verifica médias: escrita 80/100 = 0,8; leitura 8/10 = 0,8 → OK (se a leitura média fosse menor, nenhum FIFO chegava). Pior caso: 80 escritas no fim de uma janela + 80 no início da seguinte = 160 escritas em 160 ciclos seguidos. Nesses 160 ciclos o leitor lê 160 × 0,8 = 128. Profundidade = 160 − 128 = <b>32</b> (+ margem para latência de sincronização se for CDC).');
IV('fsm', 'Desenha uma FSM que deteta "110" numa sequência série, Moore e Mealy. Compara.', 'Mealy: S0 (nada), S1 ("1"), S2 ("11"); em S2 com 0 → saída 1 e S0. Moore: S0, S1, S2, S3 ("110", saída 1); de S3: 1→S1, 0→S0. Mealy usa menos estados e reage no mesmo ciclo; Moore tem saídas registadas/sem glitches e 1 ciclo de atraso.');
IV('counters', 'Desenha um divisor de relógio por 3 com duty cycle de 50%.', 'Contador mod-3 em posedge (0,1,2). Sinal a = (cnt==0) (ou cnt<1) em posedge; b = a amostrado em negedge. clk_out = a | b → alto durante 1,5 ciclos de 3. Mencionar: glitch-free porque a e b vêm de flops; em ASIC usar células dedicadas e generated clocks no SDC.');
IV('nba', 'Qual a diferença entre = e <= em Verilog e quando usas cada?', 'Blocking (=) executa sequencialmente e atualiza logo; non-blocking (<=) avalia todos os RHS e atualiza no fim do time-step. Sequencial → <=; combinacional → =; nunca misturar no mesmo bloco; nunca atribuir a mesma variável em 2 blocos. Evita races e mismatches sim/síntese.');
IV('latchinf', 'Como infere a ferramenta um latch? É sempre mau?', 'Quando uma saída de lógica combinacional não é atribuída em todos os caminhos (precisa de memória). Mau quando acidental (timing difícil, glitches, testabilidade). Latches intencionais: ICG, time borrowing em designs de alto desempenho, latch-based register files para área/potência.');
IV('hs', 'Implementa um registo de pipeline valid/ready. Porque é que o ready combinacional pode ser problema num pipeline longo?', 'ready_up = !valid_q || ready_dn; regista dados quando ready_up. Ready atravessa todos os estágios combinacionalmente para trás → caminho longo e por vezes loop; solução: skid buffers (ready registado) a cada N estágios.');
IV('fifo', 'Escreve um FIFO síncrono parametrizável. Como geras full e empty?', 'Ponteiros com bit extra; empty = (w==r); full = MSBs diferentes e restantes iguais; ou contador de ocupação. Escrita protegida por !full, leitura por !empty. Mencionar opções: registered output vs fall-through, almost_full para back-pressure com latência.');
IV('arb', 'Desenha um árbitro round-robin para N requisitantes. Como provas que é justo?', 'Máscara com bits acima do último vencedor; prioridade fixa nos pedidos mascarados; se nenhum, nos não mascarados. Fairness: após servir i, i fica com menor prioridade; cada requisitante ativo é servido em ≤ N−1 grants. Prova com assertion formal: req[i] mantido → grant[i] em ≤ N ciclos.');
IV('bits', 'Dado um vetor de 32 bits, gera um vetor onde só o 1 mais significativo fica ativo.', 'Propagar para a direita: y = x | x>>1 | x>>2 ... (smear) e depois y ^ (y>>1). Ou bit-reverse + x & -x + bit-reverse. Ou encoder de prioridade + decoder. Discutir profundidade lógica (log N).');
IV('bits', 'Como verificarias se exatamente um bit está a 1 num vetor de 64 bits, em hardware rápido?', 'x != 0 && (x & (x−1)) == 0 — mas o subtrator de 64 bits é lento. Alternativa em árvore: cada nó produz (algum, mais_que_um): algum = aL|aR, mais = mL|mR|(aL&aR). Profundidade log₂64 = 6.');
IV('cache', 'Desenha um cache controller direct-mapped com write-back. Que estados tem a FSM?', 'IDLE → COMPARE_TAG (hit: ler/escrever, write marca dirty) → se miss e dirty: WRITE_BACK (escreve linha antiga) → ALLOCATE (lê linha nova da memória) → volta a COMPARE. Arrays: tag, valid, dirty, data. Discutir: write-allocate, critical-word-first, MSHRs para non-blocking.');
IV('gpu', 'O que é warp divergence e como a hardware lida com ela?', 'Threads de um warp tomam caminhos diferentes num branch; SIMT executa cada caminho com máscara de lanes ativas, serializando; reconvergência no pós-dominador (pilha de reconvergência, ou em arquiteturas recentes, scheduling independente por thread com convergence barriers). Custo: lanes ociosas.');
IV('gpumem', 'Explica memory coalescing e dá um exemplo de código CUDA mau e bom.', 'Acessos de um warp a endereços contíguos combinam-se em poucas transações. Mau: a[threadIdx.x * 32] ou acesso por colunas a matriz row-major; bom: a[blockIdx.x*blockDim.x + threadIdx.x]. Usar shared memory para transpor e manter acessos globais coalescidos.');
IV('tensor', 'Desenha uma systolic array 2×2 para multiplicar matrizes. Como fluem os dados?', 'Cada PE: acc += a_in*b_in; passa a para a direita e b para baixo (registados). A entra pela esquerda com skew (linha i atrasada i ciclos), B por cima com skew por coluna. Após 3N−2 ciclos todos os acumuladores têm C. Output-stationary (C fica nos PEs) vs weight-stationary (B fica).');
IV('power', 'Quais as principais técnicas para reduzir potência num design RTL?', 'Clock gating (fino e grosso), operand isolation (não deixar entradas de datapath comutar quando o resultado não é usado), reduzir atividade (codificação, evitar glitches), memória: desligar bancos não usados, power gating de blocos, DVFS, multi-Vt (físico), reduzir fan-out de sinais muito ativos, evitar reset desnecessário em datapaths.');
IV('sta', 'O que é um false path e um multicycle path? Dá exemplos.', 'False path: caminho topológico que nunca é sensibilizado funcionalmente ou não importa (ex: registos de configuração estáticos, entre domínios assíncronos tratados por sync — com cuidado). Multicycle: o dado só é amostrado a cada N ciclos (ex: enable a cada 2 ciclos). Lembrar o ajuste de hold N−1.');
IV('flow', 'O que acontece entre escreveres RTL e o chip voltar da fábrica? Que problemas podem obrigar-te a mudar o RTL tarde no projeto?', 'Lint/CDC, verificação, síntese, DFT, P&R, sign-off (STA, potência, IR, DRC/LVS, LEC), tapeout. Mudanças tardias: timing que não fecha (pipeline), congestion (estruturas muito ligadas: crossbars), potência acima do orçamento, bugs encontrados em emulação → ECOs (engineering change orders) metal-only quando possível.');
IV('pipe', 'Um somador de 64 bits não cabe num ciclo a 3 GHz. Que opções tens?', 'Somador de prefixo mais rápido (Kogge-Stone), pipelining em 2 ciclos (soma 32 baixos + carry para o próximo ciclo), carry-save se for parte de uma acumulação (resolver o carry só no fim), mudar algoritmo para evitar o somador largo no caminho crítico.');
IV('reset', 'Porque precisa cada domínio de relógio do seu próprio sincronizador de reset?', 'A desativação do reset tem de cumprir recovery/removal em relação ao relógio de cada domínio; um reset sincronizado para o domínio A é assíncrono em relação a B. Também: domínios saem do reset em ciclos diferentes — protocolo/sequência deve tolerar isso.');
IV('credit', 'Projeta a interface entre dois chips com 20 ciclos de latência de fio. Como controlas o fluxo?', 'Créditos: emissor com contador inicializado ao nº de buffers do recetor (≥ RTT para pleno débito ≈ 40+ ciclos ida+volta); decrementa ao enviar; recetor devolve créditos (possivelmente agregados) ao libertar. Alternativa: almost-full com margem ≥ RTT. Considerar ECC/retransmissão, canais virtuais para evitar deadlock.');
IV('isa', 'Como aumentarias o desempenho de um core in-order de 5 estágios?', 'Forwarding completo, melhor branch prediction (BTB+bimodal/gshare), caches maiores/associativas, prefetching, superescalar (2-wide), pipeline mais profundo (mais frequência, mais penalidade de branch), instruções compostas (fusion). Avaliar com Iron Law e Amdahl.');
IV('mem', 'Precisas de uma memória com 4 leituras e 2 escritas por ciclo. Como a constróis com SRAMs de 1R1W?', 'Leituras: replicar (cada cópia serve 1 leitura). Escritas múltiplas: banking com tratamento de conflitos, ou LVT (live value table que indica qual banco tem o valor mais recente), ou XOR-based multiport. Ou flops se for pequena. Discutir área vs complexidade.');
IV('verif', 'Que propriedades formais escreverias para um árbitro?', 'Mutual exclusion: $onehot0(gnt). Grant só com pedido: gnt[i] |-> req[i]. Sem starvation: req[i] mantido |-> ##[1:N] gnt[i] (com fairness). Work-conserving: |req |-> |gnt (se o design o exige). Estabilidade em handshake: gnt mantém-se até done (se protocolo).');
IV('intv', 'Fala de um projeto do teu CV em 2 minutos, como numa entrevista.', 'Estrutura: objetivo e especificação (números: freq, área, throughput) → arquitetura (diagrama mental) → a decisão mais difícil e alternativas consideradas → como verificaste → resultado medido → o que melhorarias. Ensaiar em voz alta; preparar perguntas de seguimento sobre cada bloco.');
IV('coh', 'Duas threads em cores diferentes incrementam contadores diferentes, mas o desempenho é péssimo. Porquê?', 'False sharing: os contadores estão na mesma linha de cache; cada escrita invalida a cópia do outro core (MESI ping-pong). Solução: padding/alinhamento para linhas separadas.');
IV('noc', 'Quanta largura de banda de memória precisa um acelerador de 100 TFLOP/s com intensidade aritmética de 50 FLOP/byte?', 'BW = 100e12 / 50 = 2 TB/s. Modelo roofline: se a memória fornece menos, o kernel fica memory-bound; para usar menos BW, aumentar reutilização (tiling maior, cache/shared memory).');
IV('cg', 'Um colega usou "assign gclk = clk & en;" no RTL. O que lhe dizes?', 'Risco de glitch se en mudar com clk alto; problemas de STA/CTS (gating fora de células reconhecidas), DFT. Usar célula ICG da biblioteca (latch + AND) ou deixar a síntese inserir via enable; adicionar test_en.');
IV('synth', 'Que diferenças podem existir entre simulação RTL e simulação gate-level?', 'Sensitivity lists incompletas, X-optimism/pessimism, initial blocks ignorados, atrasos #, full_case/parallel_case pragmas, latches inferidos, races com blocking, sinais não inicializados que a síntese otimiza, problemas de reset. GLS com SDF apanha também timing e problemas de reset/X.');
IV('mult', 'Implementa um multiplicador 32×32 que tem de correr a 2 GHz. Opções?', 'Booth radix-4 (17 produtos parciais) + árvore Wallace/Dadda de CSAs + somador final rápido; pipelinar em 2–4 estágios (após a recodificação, a meio da árvore, antes/depois do somador final). Alternativa iterativa se throughput baixo for aceitável (área pequena).');
IV('le', 'Tens de conduzir uma carga 1000× maior que a entrada. Quantos inversores pões e porquê?', 'N ótimo ≈ log₄(1000) ≈ 5 (esforço por estágio ~4, entre 3 e 6 é quase igual). Com N par/ímpar escolhe-se conforme a polaridade necessária. Atraso ≈ N(F^{1/N} + p).');
IV('wire', 'Um sinal atravessa o chip inteiro (10 mm). Que problemas há e como o RTL deve lidar?', 'Atraso de fio enorme (vários ciclos a GHz), crosstalk, repetidores. O RTL deve inserir estágios de pipeline (flops de "transporte"), usar controlo por créditos e evitar handshakes combinacionais longos. Planeamento de floorplan com o físico.');
IV('dft', 'Porque é que DFT afeta o teu RTL?', 'Clock gating e resets precisam de controlo em modo teste (test_en, reset bypass); relógios gerados internamente precisam de mux para relógio de teste; latches e lógica assíncrona reduzem cobertura; memórias precisam de MBIST collars; evitar loops combinacionais.');
IV('ooo', 'O que é register renaming e porque elimina hazards WAR/WAW?', 'Cada escrita a um registo arquitetural recebe um registo físico novo (free list + RAT). Leitores antigos continuam a ler o físico antigo → WAR desaparece; duas escritas vão para físicos diferentes → WAW desaparece. Só RAW (verdadeiras dependências) ficam.');
IV('adders', 'Compara ripple-carry, carry-lookahead, carry-select e Kogge-Stone em área e atraso.', 'Ripple: área mínima, O(N). CLA em blocos: O(log N)/O(√N) consoante a estrutura. Carry-select: ~2× área na parte superior, O(√N) com blocos de tamanho crescente. Kogge-Stone: O(log N) com fan-out 2 mas muitos fios (N log N), muita área/potência. Brent-Kung: 2log N níveis, menos fios. Síntese escolhe pela restrição.');
IV('tb', 'O que é um scoreboard e um modelo de referência? Porque não basta olhar para ondas?', 'Modelo de referência: implementação comportamental (ex: em SV ou C) do comportamento esperado; scoreboard compara automaticamente saídas do DUT com o modelo. Ondas não escalam a milhões de ciclos e aleatoriedade; auto-verificação é o que permite regressões noturnas.');

const TOOLS = `<p class="muted small">Ferramentas grátis: <a href="https://www.edaplayground.com/" target="_blank" rel="noopener">EDA Playground</a> (no browser), <a href="https://hdlbits.01xz.net/" target="_blank" rel="noopener">HDLBits</a>, Icarus Verilog + GTKWave, <a href="https://www.veripool.org/verilator/" target="_blank" rel="noopener">Verilator</a>, <a href="https://github.com/YosysHQ/yosys" target="_blank" rel="noopener">Yosys</a> (síntese), SymbiYosys (formal). Põe cada projeto no teu GitHub — é o teu portefólio.</p>`;
const PROJ = [];
const P = (title, size, parts, spec, check, sol) => PROJ.push({ title, size, parts, spec, check, sol });
P('MUX parametrizável N:1', 'Pequeno', ['Implementa e testa'], `<p>Cria <code>mux_n #(W, N)</code> com <code>in[N][W]</code>, <code>sel[$clog2(N)]</code>, <code>out[W]</code>. Testa com N=2, 4, 5 (não potência de 2!).</p>`, ['Funciona para N não potência de 2', 'Testbench compara com modelo para todos os sel', 'Viste o número de células em Yosys'], CODE(`
module mux_n #(parameter int W=8, N=4) (
  input  logic [N-1:0][W-1:0] in,
  input  logic [$clog2(N)-1:0] sel,
  output logic [W-1:0] out);
  always_comb out = (sel < N) ? in[sel] : '0;
endmodule`));
P('Decoder 3→8 e encoder de prioridade 8→3', 'Pequeno', ['Implementa e testa'], `<p>Decoder com enable. Encoder de prioridade (MSB ganha) com saída <code>valid</code>. Testa exaustivamente (256 entradas).</p>`, ['Teste exaustivo automático', 'Sem latches (verifica o relatório)', 'Versão com loop e versão com casez'], CODE(`
module prio_enc8 (input logic [7:0] x, output logic [2:0] idx, output logic valid);
  always_comb begin
    idx = '0; valid = |x;
    for (int i = 0; i < 8; i++) if (x[i]) idx = 3'(i); // o maior i ganha
  end
endmodule`));
P('Somador N bits com flags (C, V, N, Z)', 'Pequeno', ['Implementa e testa'], `<p>Somador/subtrator com <code>sub</code>: produz soma e flags carry, overflow, negativo e zero como num CPU.</p>`, ['Overflow correto em casos-limite (127+1, −128−1)', 'Teste aleatório contra $signed', 'Subtração via ~B + 1'], CODE(`
module addsub #(parameter int W=8) (input logic [W-1:0] a, b, input logic sub,
  output logic [W-1:0] s, output logic c, v, n, z);
  logic [W-1:0] bb; assign bb = sub ? ~b : b;
  assign {c, s} = a + bb + sub;
  assign v = (a[W-1] == bb[W-1]) && (s[W-1] != a[W-1]);
  assign n = s[W-1];  assign z = (s == '0);
endmodule`));
P('ALU de 8 bits', 'Pequeno', ['Implementa e testa'], `<p>Operações: ADD, SUB, AND, OR, XOR, SLL, SRL, SRA, SLT (com sinal), SLTU. Opcode de 4 bits.</p>`, ['Todas as operações testadas com modelo de referência', 'SRA preserva sinal', 'SLT vs SLTU diferem nos negativos'], CODE(`
typedef enum logic [3:0] {ADD,SUB,AND_,OR_,XOR_,SLL,SRL,SRA,SLT,SLTU} op_t;
always_comb unique case (op)
  ADD:  y = a + b;            SUB:  y = a - b;
  AND_: y = a & b;            OR_:  y = a | b;     XOR_: y = a ^ b;
  SLL:  y = a << b[2:0];      SRL:  y = a >> b[2:0];
  SRA:  y = $signed(a) >>> b[2:0];
  SLT:  y = {7'b0, $signed(a) < $signed(b)};
  SLTU: y = {7'b0, a < b};

process(clk, rst_n) begin
  if rst_n = '0' then q <= '0';
  elsif rising_edge(clk) then q <= d;
  end if;
end process;`) + `<p>O SystemVerilog acrescenta <code>logic</code>, <code>always_ff/always_comb/always_latch</code>, <code>enum</code>, <code>struct packed</code>, <code>interface</code>, <code>package</code>, <code>unique/priority case</code> — tudo isto <b>sintetiza</b> e torna o código mais seguro.</p>`),
  Q('Qual destas construções de SystemVerilog é para verificação e NÃO para RTL sintetizável?', ['<code>class</code> com <code>rand</code> e <code>constraint</code>', '<code>always_ff</code>', '<code>enum logic [1:0]</code>', '<code>struct packed</code>'], 0, 'Classes, randomização e cobertura são a metade "HVL" do SystemVerilog.'),

LT('tb', 'cocotb', 'Testbenches em Python com cocotb', [S_T.COCO], [
  T('Porquê Python para verificar RTL?', `<p>O <b>cocotb</b> corre o teu RTL num simulador (Icarus, Verilator, Questa, VCS, Xcelium) e deixa-te escrever o testbench em <b>Python</b> com <code>async/await</code>. Tens NumPy, aleatoriedade e modelos de referência de graça. Cada vez mais equipas (incluindo de GPU) usam-no para testes de bloco e para gerar estímulos.</p>`),
  T('Exemplo: testar um somador', CODE(`
import cocotb, random
from cocotb.clock import Clock
from cocotb.triggers import RisingEdge

@cocotb.test()
async def soma_aleatoria(dut):
    cocotb.start_soon(Clock(dut.clk, 10, units="ns").start())
    for _ in range(1000):
        a, b = random.randrange(256), random.randrange(256)
        dut.a.value, dut.b.value = a, b
        await RisingEdge(dut.clk)
        await RisingEdge(dut.clk)          # 1 ciclo de latência
        assert dut.s.value == (a + b) % 256, f"{a}+{b}"`) + `<p>Um <code>Makefile</code> com <code>SIM=icarus TOPLEVEL=adder MODULE=test_adder</code> e <code>include $(shell cocotb-config --makefiles)/Makefile.sim</code> e já corre com <code>make</code>.</p>`),
  Q('Em cocotb, <code>await RisingEdge(dut.clk)</code>:', ['Suspende a corrotina até ao próximo flanco ascendente do relógio', 'Gera um flanco no relógio', 'Termina o teste', 'Lê o valor do relógio'], 0, ''),
  Q('Grande vantagem do cocotb em relação a um testbench SV puro:', ['Usar bibliotecas Python (NumPy, modelos golden) e escrever testes depressa', 'Simula mais rápido que qualquer simulador', 'Sintetiza o testbench', 'Não precisa de simulador'], 0, 'O cocotb usa sempre um simulador por baixo (via VPI/VHPI).'),
], [
  TF('O cocotb substitui o simulador.', false, 'Liga-se ao simulador pela interface VPI/VHPI/FLI.'),
  Q('Para iniciar um relógio em paralelo com o teste usas:', ['<code>cocotb.start_soon(Clock(...).start())</code>', '<code>dut.clk = 1</code>', '<code>time.sleep()</code>', '<code>fork join</code>'], 0, ''),
]);

LT('synth', 'linux', 'Linux, shell, Make, Git e scripting (Python/Perl)', [S_T.MIS], [

SIM   ?= verilator

], [

LT('verif', 'uvm', 'UVM: a metodologia de verificação da indústria', [S_T.UVM, S_T.VUVM, S_.CHIPV], [
  T('Arquitetura de um testbench UVM', `<p>A <b>UVM</b> (Universal Verification Methodology, IEEE 1800.2) é uma biblioteca de classes SystemVerilog. Componentes:</p><ul><li><b>sequence_item</b>: uma transação (ex: escrita AXI com addr/data).</li><li><b>sequence</b>: gera itens aleatórios com constraints.</li><li><b>driver</b>: converte itens em sinais na interface.</li><li><b>monitor</b>: observa os sinais e reconstrói transações.</li><li><b>agent</b> = sequencer + driver + monitor.</li><li><b>scoreboard</b>: compara a saída do DUT com um modelo de referência.</li><li><b>env</b> e <b>test</b>: montam tudo; o <code>uvm_config_db</code> e a <i>factory</i> permitem trocar peças sem editar código.</li></ul><p>Fases: <code>build → connect → run → report</code>. Cobertura funcional com <code>covergroup</code> mede o que já foi testado.</p>`),
  T('Um driver mínimo', CODE(`
class fifo_driver extends uvm_driver #(fifo_item);
  \`uvm_component_utils(fifo_driver)
  virtual fifo_if vif;
  function new(string name, uvm_component parent); super.new(name, parent); endfunction
  task run_phase(uvm_phase phase);
    forever begin
      seq_item_port.get_next_item(req);
      @(posedge vif.clk);
      vif.push  <= req.push;
      vif.wdata <= req.data;
      seq_item_port.item_done();
    end
  endtask
endclass`)),
  Q('Que componente UVM compara a saída do DUT com o valor esperado?', ['Scoreboard', 'Driver', 'Sequencer', 'Interface'], 0, ''),
  Q('Para que serve a factory da UVM?', ['Substituir tipos (ex: trocar um driver por um com injeção de erros) sem alterar o código do ambiente', 'Sintetizar o testbench', 'Gerar relógios', 'Guardar waveforms'], 0, '<code>set_type_override_by_type</code>.'),
], [
  TF('O monitor UVM deve conduzir (drive) sinais no DUT.', false, 'O monitor só observa; quem conduz é o driver.'),
  Q('Cobertura funcional em SV escreve-se com:', ['<code>covergroup</code> / <code>coverpoint</code>', '<code>assert</code>', '<code>always_ff</code>', '<code>$display</code>'], 0, ''),
  Q('Um agent "passive" contém:', ['Só o monitor', 'Driver e sequencer', 'Só o scoreboard', 'Nada'], 0, ''),
]);

LT('verif', 'sva', 'Assertions SVA e verificação formal (JasperGold, VC Formal, SymbiYosys)', [S_.SVA, S_T.SBY, S_T.VUVM], [
  T('Assertions concorrentes', CODE(`
// valid tem de se manter até ready, e os dados estáveis
property p_hold;
  @(posedge clk) disable iff (!rst_n)
  valid && !ready |=> valid && $stable(data);
endproperty
a_hold: assert property (p_hold);

// pedido é sempre servido em <= 8 ciclos
a_lat:  assert property (@(posedge clk) req |-> ##[1:8] gnt);
// grant one-hot
a_oh:   assert property (@(posedge clk) $onehot0(gnt));
c_full: cover  property (@(posedge clk) full);`) + `<p><code>|-></code> verifica no mesmo ciclo, <code>|=></code> no ciclo seguinte; <code>##[1:8]</code> é uma janela; <code>$past</code>, <code>$rose</code>, <code>$fell</code>, <code>$stable</code> olham para a história.</p>`),
  T('Formal: provar em vez de testar', `<p>Uma ferramenta formal (Cadence <b>JasperGold</b>, Synopsys <b>VC Formal</b>, Siemens Questa Formal, <b>SymbiYosys</b> grátis) explora <b>todos</b> os estímulos possíveis e ou <b>prova</b> a propriedade ou dá um <b>contraexemplo</b> (uma waveform curta que a viola). Usa <code>assume</code> para restringir as entradas a comportamentos legais. Muito usado em árbitros, FIFOs, controladores de cache e protocolos — exatamente os blocos de uma GPU.</p>`),
  Q('<code>a |=> b</code> significa:', ['Se a for verdade neste ciclo, b tem de ser verdade no ciclo seguinte', 'a e b no mesmo ciclo', 'b implica a', 'a nunca acontece'], 0, ''),
  Q('Numa prova formal, para que serve <code>assume property</code>?', ['Restringir as entradas a comportamentos legais do ambiente', 'Verificar a saída', 'Contar cobertura', 'Desligar o relógio'], 0, 'Sem assumptions, a ferramenta encontra contraexemplos com entradas impossíveis.'),
], [
  Q('Que função verifica que no máximo um bit está a 1?', ['<code>$onehot0</code>', '<code>$countones == 2</code>', '<code>$past</code>', '<code>$stable</code>'], 0, ''),
  TF('Se a ferramenta formal prova uma propriedade (com as assumptions certas), ela é verdadeira para todos os estímulos possíveis.', true, 'Pode ser uma prova completa ou limitada (bounded) a N ciclos.'),
  Q('<code>disable iff (!rst_n)</code> serve para:', ['Não avaliar a assertion durante o reset', 'Ativar o reset', 'Fazer a assertion falhar', 'Medir o reset'], 0, ''),
]);

    if causal:
        n = s.size(-1)
        s = s.masked_fill(torch.triu(torch.ones(n, n, dtype=torch.bool), 1), float('-inf'))
    return torch.softmax(s, dim=-1) @ v`)),

/* ===== Perguntas de entrevista ===== */
const IV = (tag, q, ans) => { const o = OPEN(q, ans); o.tag = tag; COURSE.interview.push(o); };
IV('overfit', 'Explica o compromisso bias–variance e como o diagnosticas na prática.', 'Bias: erro por o modelo ser demasiado simples (underfitting). Variância: sensibilidade excessiva aos dados de treino (overfitting). Diagnóstico com curvas de treino e validação: ambas altas → bias (modelo maior, mais features, treinar mais); treino baixo e validação alta → variância (mais dados, regularização, augmentation, early stopping, modelo menor).');
IV('backprop', 'Explica o backpropagation a alguém que sabe cálculo mas não ML.', 'A rede é uma composição de funções. Queremos ∂L/∂w para cada peso. O forward calcula e guarda os valores intermédios; o backward aplica a regra da cadeia de trás para a frente: cada operação recebe ∂L/∂(saída) e multiplica pela sua derivada local para obter ∂L/∂(entradas). Custo ≈ 2× o forward, e reutiliza resultados em vez de derivar cada peso separadamente.');
IV('metrics', 'Tens um detetor de fraude com 99,5% de accuracy. Porque podes não estar contente? Que métricas usarias?', 'Se só 0,5% das transações são fraude, dizer sempre "não fraude" dá 99,5%. Usa precision, recall, F1, PR-AUC (melhor que ROC-AUC com classes muito desequilibradas), e escolhe o limiar pelo custo de cada erro (perder uma fraude vs bloquear um cliente).');
IV('attn', 'Implementa (ou explica linha a linha) a self-attention com máscara causal. Qual é a complexidade?', 'Q = XW_q, K = XW_k, V = XW_v. Scores = QKᵀ/√d (n×n). Máscara: posições j > i a −∞. Softmax por linha. Saída = pesos·V, depois concatenar cabeças e projetar. Complexidade O(n²d) em tempo e O(n²) em memória para os scores (por cabeça). FlashAttention evita materializar a matriz n×n.');
IV('transformer', 'Porque é que os transformers substituíram as RNNs?', 'Paralelismo no treino (todos os tokens de uma vez, ótimo em GPU), caminho de comprimento 1 entre quaisquer dois tokens (dependências longas sem gradientes a desaparecer), e escalam muito bem com dados e computação (scaling laws). Custo: atenção quadrática no comprimento.');
IV('norm', 'BatchNorm vs LayerNorm: diferenças e quando usar cada.', 'BatchNorm normaliza cada feature/canal com estatísticas do batch (e médias móveis na inferência); bom em CNNs com batches grandes. LayerNorm normaliza cada exemplo ao longo das suas features; independente do batch, funciona com sequências e batch 1 — padrão em transformers (ou RMSNorm, mais barata).');
IV('optim', 'Explica o Adam. Porque é que o AdamW é preferido?', 'Adam mantém médias móveis do gradiente (m, momentum) e do gradiente ao quadrado (v), com correção de bias, e atualiza θ ← θ − η·m̂/(√v̂ + ε): passo adaptativo por parâmetro. O AdamW aplica o weight decay diretamente aos pesos em vez de o meter no gradiente, o que interage melhor com a escala adaptativa.');
IV('gpuai', 'Estima a memória necessária para treinar um modelo de 7 B parâmetros com Adam em precisão mista. Cabe numa GPU de 80 GB?', '≈16 bytes por parâmetro (2 pesos BF16 + 2 gradientes + 4 cópia FP32 + 4 m + 4 v) → ~112 GB, sem contar ativações. Não cabe; usa-se ZeRO/FSDP para dividir estados entre GPUs, activation checkpointing, ou otimizadores de 8 bits. Para inferência em BF16 bastam ~14 GB de pesos + KV cache.');
IV('flops', 'O que é o modelo roofline? Classifica GEMM grande, LayerNorm e decode de LLM com batch 1.', 'Desempenho = min(pico de computação, intensidade aritmética × largura de banda). GEMM grande: intensidade alta (≈n/3 FLOPs/byte em FP16) → compute-bound. LayerNorm e operações elemento a elemento: ~1 FLOP/byte → memory-bound (fundir kernels ajuda). Decode batch 1: cada peso lido para 2 FLOPs → memory-bound; aumentar o batch e quantizar pesos ajuda.');
IV('quant', 'Como quantizarias um LLM para INT4 mantendo a qualidade? Que problemas aparecem?', 'Quantização por grupos (ex.: escala por cada 128 pesos), métodos que usam dados de calibração (GPTQ minimiza o erro de reconstrução camada a camada; AWQ protege canais com ativações grandes). Problemas: outliers nas ativações (SmoothQuant transfere a dificuldade para os pesos), camadas sensíveis (manter em maior precisão), avaliação cuidadosa em tarefas reais, não só perplexidade.');
IV('infer', 'Explica o KV cache e calcula o seu tamanho para um modelo à tua escolha.', 'Na geração autoregressiva, keys e values dos tokens anteriores não mudam; guardam-se para não recalcular a atenção sobre todo o prefixo (de O(n²) para O(n) por token). Tamanho = 2 × camadas × tokens × (cabeças_kv × d_cabeça) × bytes × batch. Ex.: 32 camadas, d=4096, 4096 tokens, FP16 → 2·32·4096·4096·2 ≈ 2,1 GB por sequência; com GQA de 8 grupos (em vez de 32 cabeças), 4× menos.');
IV('dist', 'Compara data, tensor e pipeline parallelism. Como os combinarias para treinar um modelo de 70 B em 1024 GPUs?', 'Data: réplicas completas, all-reduce dos gradientes; simples mas a memória por GPU não diminui (ZeRO/FSDP resolve). Tensor: divide matrizes, muita comunicação → dentro do nó (8 GPUs com NVLink). Pipeline: camadas por estágios, comunicação só de ativações entre estágios, bolhas reduzidas com micro-batches. Ex.: TP=8 dentro do nó, PP=4 entre nós, DP=32 no resto (8·4·32 = 1024).');
IV('accel', 'Desenha a microarquitetura de um acelerador para GEMM INT8. Que decisões são críticas?', 'Systolic array (ex.: 128×128 PEs com MAC INT8 e acumulador INT32), dataflow (weight-stationary para inferência), buffers SRAM on-chip com double buffering para esconder a latência da DRAM, tiling do problema para maximizar reutilização, unidade de pós-processamento (escala, bias, ativação, requantização) e controlo por instruções/descritores. Métricas: utilização dos PEs, TOPS/W, largura de banda necessária vs intensidade aritmética.');
IV('stack', 'O teu treino em PyTorch está lento. Como investigas?', 'Medir primeiro: utilização da GPU (nvidia-smi), profiler do PyTorch ou Nsight Systems. Se a GPU está à espera de dados: DataLoader com mais workers, pin_memory, pré-processamento offline. Se há muitos kernels pequenos: torch.compile/kernel fusion, batch maior. Usar precisão mista (BF16), garantir dimensões múltiplas de 8/16 para os Tensor Cores, evitar sincronizações CPU-GPU (.item() no ciclo), e verificar a comunicação em multi-GPU.');
IV('llmtrain', 'Como funciona o LoRA e porque é tão usado?', 'Congela os pesos W do modelo e aprende uma atualização de rank baixo ΔW = B·A (B: d×r, A: r×k, r ≪ d), somada à saída da camada. Treina <1% dos parâmetros, cabe em GPUs pequenas, e cada tarefa é um ficheiro pequeno que se pode trocar. Depois pode-se juntar ΔW a W para não haver custo na inferência. QLoRA faz o mesmo com o modelo base em 4 bits.');
IV('genai', 'Desenha um sistema RAG para responder a perguntas sobre a documentação de uma GPU. Como o avalias?', 'Ingestão: partir os documentos em pedaços (com sobreposição e metadados), gerar embeddings, guardar numa base vetorial. Consulta: embedding da pergunta, pesquisa top-k (híbrida com BM25), re-ranking, montar o prompt com citações, gerar. Avaliação: conjunto de perguntas com respostas de referência, medir recall da recuperação, fidelidade às fontes, correção (humana ou LLM-juiz), latência e custo.');
IV('cnn', 'Calcula parâmetros e FLOPs de uma convolução 3×3, 64→128 canais, numa entrada 56×56 (stride 1, padding 1).', 'Parâmetros: 3·3·64·128 = 73 728 (+128 bias). Saída 56×56×128. MACs = 56·56·128·(3·3·64) ≈ 231 M MACs ≈ 462 MFLOPs. Implementação: im2col + GEMM ou algoritmos de Winograd/implicit GEMM em cuDNN.');
IV('trees', 'Random forest vs gradient boosting: diferenças e quando escolher cada um.', 'RF: árvores profundas independentes em amostras bootstrap, média reduz variância, robusto e paralelizável, poucos hiperparâmetros. Boosting: árvores rasas sequenciais que corrigem resíduos, reduz bias, normalmente mais preciso em dados tabulares mas mais sensível a hiperparâmetros (learning rate, nº de árvores, profundidade) e a overfitting.');

P('Micrograd: o teu próprio autograd', 'Médio', ['Classe Value com forward', 'Backward e treinar um MLP'], `<p>Segue o vídeo de Andrej Karpathy "The spelled-out intro to neural networks and backpropagation". Implementa uma classe <code>Value</code> com +, ×, tanh e <code>backward()</code>, e treina um MLP pequeno.</p>`, ['Gradientes verificados contra PyTorch', 'MLP aprende um problema não linear', 'Explicaste o backward por escrito'], CODE(`
class Value:
    def __init__(self, data, _children=()):
        self.data, self.grad, self._prev, self._backward = data, 0.0, set(_children), lambda: None
    def __mul__(self, other):
        out = Value(self.data * other.data, (self, other))
        def _backward():
            self.grad += other.data * out.grad
            other.grad += self.data * out.grad
        out._backward = _backward
        return out`));

__global__ void matmul_tiled(const float* A, const float* B, float* C, int N) {
  __shared__ float As[16][16], Bs[16][16];
  int r = blockIdx.y * 16 + threadIdx.y, c = blockIdx.x * 16 + threadIdx.x;
  float acc = 0.f;
  for (int t = 0; t < N / 16; ++t) {
    As[threadIdx.y][threadIdx.x] = A[r * N + t * 16 + threadIdx.x];
    Bs[threadIdx.y][threadIdx.x] = B[(t * 16 + threadIdx.y) * N + c];
    __syncthreads();
    for (int k = 0; k < 16; ++k) acc += As[threadIdx.y][k] * Bs[k][threadIdx.x];
    __syncthreads();
  }
  C[r * N + c] = acc;
}`));

L('distpar', U3, 'Distância de paragem: reação + travagem', [D_.PRP, D_.ERSO], [
  T('A física da travagem', `<p><b>Distância de paragem = distância de reação + distância de travagem.</b></p><ul><li>Reação (tempo típico ~1 s, mais com cansaço, álcool, telemóvel): <code>d = v × t</code> (v em m/s = km/h ÷ 3,6).</li><li>Travagem: <code>d ≈ v² / (2·μ·g)</code> — cresce com o <b>quadrado</b> da velocidade.</li></ul><div class="key">Regra prática da escola: reação ≈ (km/h ÷ 10) × 3; travagem (seco) ≈ (km/h ÷ 10)². A 50 km/h: 15 + 25 = <b>40 m</b>. Duplicar a velocidade ≈ <b>quadruplicar</b> a travagem.</div>`),
  W('stopdist', { h: 'Simulador de paragem', b: '<p>Experimenta 50 vs 60 km/h em piso molhado. Repara como 10 km/h a mais fazem uma grande diferença.</p>' }),
  G('d_stop'),
], [

  Q('Se duplicares a velocidade, a distância de travagem (mesmas condições):', ['Fica ~4 vezes maior', 'Duplica', 'Fica igual', 'Fica 8 vezes maior'], 0, ''),

L('priorid', U3, 'Prioridade: a regra geral da direita', [D_.CE], [
  T('Cede a quem vem da direita', `<p>Num cruzamento ou entroncamento <b>sem sinalização</b>, cedes passagem aos veículos que se apresentam <b>pela tua direita</b>.</p><p><b>Exceções importantes</b> — cedem sempre passagem os condutores que:</p><ul><li>saem de parques de estacionamento, zonas de abastecimento, prédios ou caminhos particulares;</li><li>entram numa via vindos de caminhos de terra batida;</li><li>fazem marcha atrás ou inversão de marcha;</li><li>entram numa rotunda (cedem a quem já circula nela, em regra).</li></ul><p>Os <b>veículos em missão urgente</b> (com sinais luminosos e sonoros ligados) têm sempre prioridade: facilita a passagem.</p>`),

  Q('Sais da garagem de um prédio para a rua. Quem tem prioridade?', ['Os veículos que circulam na rua', 'Tu, se vieres da direita deles', 'Quem buzinar', 'Quem for maior'], 0, ''),

  TF('Uma ambulância com sinais luminosos e sonoros tem prioridade mesmo com o semáforo verde para ti.', true, ''),

  Q('Quem faz inversão de marcha:', ['Cede passagem a todos os outros', 'Tem prioridade', 'Usa a regra da direita', 'Só cede aos peões'], 0, ''),
  Q('Num cruzamento sem sinais com 4 carros a chegar ao mesmo tempo (um de cada lado), a solução é:', ['Comunicação e prudência: um avança cedendo cuidadosamente; ninguém deve forçar', 'Passa o maior', 'Passam todos ao mesmo tempo', 'Passa quem buzinar'], 0, 'É uma situação de bloqueio que a regra da direita não resolve.'),

L('cruz', U3, 'Cruzamentos e entroncamentos', [D_.CE], [

  Q('É proibido ultrapassar nos cruzamentos e entroncamentos, salvo em casos como:', ['Quando há semáforos/agentes a regular ou tens prioridade sinalizada e visibilidade, entre outras exceções previstas', 'Nunca há exceções', 'Sempre que quiseres', 'Só de noite'], 0, 'O Código prevê exceções — a regra base é a proibição.'),

L('rotunda', U3, 'Rotundas', [D_.CE, D_.ANSR], [
  T('As regras da rotunda', `<ul><li>Ao entrar, <b>cede passagem a quem já circula na rotunda</b> (normalmente há sinal de cedência).</li><li>Circula no sentido contrário ao dos ponteiros do relógio.</li><li><b>1.ª saída</b>: usa a via da <b>direita</b>.</li><li><b>Outras saídas</b>: podes ocupar as vias mais interiores, mas deves aproximar-te progressivamente da via da direita antes de sair, cedendo a quem nela circula.</li><li><b>Sinaliza</b>: pisca direito antes da saída que vais tomar.</li><li>Veículos pesados e velocípedes podem ocupar a via da direita mesmo para outras saídas — atenção a eles.</li></ul>`),

  T('ESPM: Espelhos – Sinal – Posição – Manobra', `<ol><li><b>Espelhos</b> (interior + exterior) e <b>ângulo morto</b> (olhar por cima do ombro).</li><li><b>Sinal</b>: pisca com antecedência suficiente.</li><li><b>Posição</b>: coloca o carro na via correta.</li><li><b>Manobra</b>: executa só se não houver perigo nem embaraço para os outros. Desliga o pisca depois.</li></ol><div class="warn">Ligar o pisca <b>não dá prioridade</b> — só informa a tua intenção.</div>`),

L('ultrap', U3, 'Ultrapassagem', [D_.CE, D_.ANSR], [
  T('Como ultrapassar', `<p>Ultrapassa-se pela <b>esquerda</b>. Antes: visibilidade suficiente, espaço livre à frente, ninguém a ultrapassar-te, o da frente não sinalizou viragem à esquerda. Durante: distância lateral adequada; ao ultrapassar <b>velocípedes</b> deixa pelo menos <b>1,5 m</b> e abranda. Depois: regressa à direita sem cortar a frente ao ultrapassado.</p><p>Quem é ultrapassado <b>não deve acelerar</b> e deve chegar-se à direita.</p>`),
  T('Onde é proibido', `<ul><li>Lombas e curvas de visibilidade reduzida.</li><li>Imediatamente antes e nas passagens de peões/velocípedes.</li><li>Passagens de nível e suas proximidades.</li><li>Cruzamentos e entroncamentos (salvo exceções).</li><li>Com linha contínua / sinal de proibição.</li></ul><p>Ultrapassar pela direita só é permitido em casos como quando o veículo da frente sinalizou e se encostou para virar à esquerda (e em filas de trânsito em vias com várias vias, nas condições legais).</p>`),

  Q('Antes de iniciar uma ultrapassagem deves confirmar que:', ['Ninguém atrás iniciou já uma ultrapassagem a ti', 'O carro da frente acelera', 'Tens os médios ligados', 'Está a chover'], 0, ''),
  Q('Ultrapassar numa curva sem visibilidade é perigoso sobretudo porque:', ['Não vês veículos em sentido contrário a tempo', 'O motor perde força', 'Os pneus aquecem', 'Gastas mais combustível'], 0, ''),

L('inversao', U3, 'Inversão de marcha e marcha atrás', [D_.CE], [
  T('Quando é proibido', `<p><b>Inversão de marcha</b> proibida em: autoestradas e vias reservadas a automóveis; lombas, curvas, cruzamentos com pouca visibilidade; passagens de nível; túneis e pontes (em regra); e onde houver sinal/linha contínua.</p><p><b>Marcha atrás</b>: só como manobra auxiliar ou de recurso, devagar e no menor trajeto possível; proibida em autoestradas (exceto emergência regulamentada), cruzamentos e curvas sem visibilidade.</p><p>Quem faz estas manobras <b>cede passagem a todos</b>.</p>`),
  Q('Na autoestrada, falhaste a saída. O que fazes?', ['Sigo até à próxima saída', 'Faço marcha atrás pela berma', 'Inverto a marcha no separador', 'Paro e espero'], 0, 'Marcha atrás/inversão em autoestrada é extremamente perigosa e proibida.'),
], [

L('estac', U3, 'Paragem e estacionamento', [D_.CE], [

L('peoes', U3, 'Peões, ciclistas e utilizadores vulneráveis', [D_.CE, D_.ANSR, D_.OMS], [
  T('Proteger os mais frágeis', `<p>O Código da Estrada estabelece que os condutores devem ter <b>especial cuidado</b> com os utilizadores vulneráveis: peões, ciclistas, crianças, idosos e pessoas com mobilidade reduzida.</p><ul><li>Nas <b>passadeiras</b>, cede passagem aos peões que já iniciaram a travessia ou que nela vão entrar; abranda ao aproximar-te.</li><li>Ao <b>mudar de direção</b>, cede aos peões que atravessam a via onde vais entrar.</li><li>Ao ultrapassar <b>ciclistas</b>: ≥ 1,5 m e velocidade reduzida.</li><li>Atenção a <b>trotinetes</b>, crianças junto a escolas, idosos (atravessam mais devagar).</li></ul><div class="key">Um peão atropelado a 50 km/h tem um risco de morte muitas vezes superior a 30 km/h (OMS). Velocidade é o fator nº 1.</div>`),

  Q('Ultrapassar um veículo que parou para deixar passar peões na passadeira é:', ['Proibido e muito perigoso', 'Permitido pela esquerda', 'Permitido se buzinares', 'Permitido de noite'], 0, ''),

L('ae', U3, 'Autoestradas e vias rápidas', [D_.CE, D_.ANSR], [
  T('Entrar, circular, sair', `<ul><li><b>Entrar</b>: usa a via de aceleração para atingir a velocidade do trânsito; cede passagem a quem circula na autoestrada; sinaliza.</li><li><b>Circular</b>: pela via mais à direita; distância de segurança; não ultrapassar pela direita.</li><li><b>Sair</b>: sinaliza com antecedência, passa para a direita e abranda <b>na via de desaceleração</b>, não na autoestrada.</li></ul><p><b>Proibido</b>: marcha atrás, inversão de marcha, parar/estacionar (exceto áreas próprias ou emergência na berma), circular na berma, peões e veículos lentos (ex: velocípedes, ciclomotores).</p>`),

L('pn', U3, 'Passagens de nível, túneis e pontes', [D_.CE, D_.RST], [
  T('Atenção redobrada', `<p><b>Passagens de nível</b>: abranda; com <b>sinal luminoso vermelho</b> (intermitente) ou barreiras a baixar/baixadas — <b>pára</b>. Nunca pares em cima da linha; não entres se o trânsito à frente estiver parado. Sem guarda: olha, ouve e só depois atravessa. Se o carro ficar imobilizado na linha: tira todos os ocupantes imediatamente e afasta-os.</p><p><b>Túneis</b>: médios ligados, sem ultrapassagens se proibido, distância maior, nunca parar exceto emergência; em incêndio, deixar o carro e seguir para as saídas de emergência.</p>`),
